<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notion MCQ Quiz</title>
  <meta name="description" content="A lightweight MCQ quiz interface designed to be embedded in Notion.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <section class="quiz-card">
      <header class="quiz-header">
        <div>
          <p class="eyebrow">MCQ practice</p>
          <h1 id="app-title">Notion MCQ Quiz</h1>
        </div>
        <div class="score-pill" aria-live="polite">
          <span id="live-score">0</span>/<span id="question-total">0</span>
        </div>
      </header>

      <section id="start-screen" class="screen">
        <h2>Start a quiz session</h2>
        <p class="muted">Answer each question, check your feedback, then move to the next one. Edit <code>questions.js</code> to add your own questions.</p>
        <button id="start-button" class="button primary">Start quiz</button>
      </section>

      <section id="quiz-screen" class="screen hidden" aria-live="polite">
        <div class="progress-row">
          <span id="progress-text">Question 1 of 1</span>
          <span id="topic-text"></span>
        </div>

        <div class="progress-bar" aria-hidden="true">
          <div id="progress-fill"></div>
        </div>

        <h2 id="question-text" class="question-text"></h2>
        <div id="options" class="options" role="radiogroup" aria-label="Answer options"></div>

        <div id="feedback" class="feedback hidden"></div>

        <div class="controls">
          <button id="submit-button" class="button primary" disabled>Submit answer</button>
          <button id="next-button" class="button secondary hidden">Next question</button>
          <button id="restart-button" class="button ghost">Restart</button>
        </div>
      </section>

      <section id="result-screen" class="screen hidden" aria-live="polite">
        <p class="eyebrow">Quiz complete</p>
        <h2 id="result-title">Result</h2>
        <p id="result-score" class="result-score"></p>
        <p id="result-message" class="muted"></p>
        <div id="review-list" class="review-list"></div>
        <button id="try-again-button" class="button primary">Try again</button>
      </section>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
